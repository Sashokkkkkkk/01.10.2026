{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="form-card" style="margin-top: 2.5rem;">
  <h1 class="section-title" style="justify-content: center;">Вход в систему</h1>
  <p style="text-align: center; color: var(--muted); margin-bottom: 1.5rem; font-weight: 500;">Только для сотрудников автосалона</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Логин</label>
      <input type="text" name="username" required autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Войти</button>
  </form>
  <p style="margin-top: 1.25rem; font-size: 0.85rem; color: var(--muted); text-align: center;">
    Демо-доступ: <strong>demo</strong> / <strong>demo123</strong>
  </p>
</div>
{% endblock %}

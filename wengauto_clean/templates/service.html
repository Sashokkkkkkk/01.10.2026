{% extends "base.html" %}
{% block title %}Сервисный центр{% endblock %}
{% block content %}
<h1 class="section-title">Сервисный центр WengAuto</h1>
<p style="margin-bottom: 1.5rem;">Онлайн-запись на техническое обслуживание и ремонт. Напоминания о плановом ТО.</p>

<div class="form-card">
  <h2 style="margin-bottom: 1rem;">Записаться на сервис</h2>
  <form method="post" action="{{ url_for('website.book_service') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="form_token" value="{{ form_token }}">
    <div style="position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden;" aria-hidden="true">
      <input type="text" name="website" tabindex="-1" autocomplete="off">
      <input type="text" name="hp_field" tabindex="-1" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Ваше имя *</label>
      <input type="text" name="name" required>
    </div>
    <div class="form-group">
      <label>Телефон *</label>
      <input type="tel" name="phone" required>
    </div>
    <div class="form-group">
      <label>Автомобиль (марка, модель, год)</label>
      <input type="text" name="car_info" placeholder="Toyota Camry 2020">
    </div>
    <div class="form-group">
      <label>Вид работ</label>
      <select name="service_type">
        <option value="ТО">Плановое ТО</option>
        <option value="ремонт">Ремонт</option>
        <option value="диагностика">Диагностика</option>
        <option value="шиномонтаж">Шиномонтаж</option>
        <option value="другое">Другое</option>
      </select>
    </div>
    <div class="form-group">
      <label>Желаемая дата</label>
      <input type="datetime-local" name="preferred_date">
    </div>
    <div class="form-group">
      <label>Комментарий</label>
      <textarea name="notes"></textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Записаться</button>
  </form>
</div>
{% endblock %}
